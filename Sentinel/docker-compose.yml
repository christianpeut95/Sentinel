services:
  sentinel-web:
    image: ${DOCKERHUB_USERNAME}/sentinel:${VERSION_TAG:-latest}
    container_name: sentinel-app
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # Caddy terminates public HTTPS. Kestrel is reachable only on the
      # private Docker network over HTTP.
      - ASPNETCORE_URLS=http://+:8080
      - ReverseProxy__UseForwardedHeaders=true
      # The bundled SQL Server is available to Sentinel on the Docker network.
      - ConnectionStrings__DefaultConnection=Server=sentinel-db,1433;Database=SentinelDb;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;
      # Geocoding configuration
      - Geocoding__Provider=${GEOCODING_PROVIDER:-google}
      - Geocoding__ApiKey=${GEOCODING_API_KEY}
      - Geocoding__GoogleMapsBrowserApiKey=${GOOGLE_MAPS_BROWSER_API_KEY}
      - Geocoding__Email=${GEOCODING_EMAIL}
      - Geocoding__DefaultCountry=${GEOCODING_DEFAULT_COUNTRY:-AU}
      # Sensitive uploads and timeline data. This volume is intentionally not web-served.
      - FileStorage__RootPath=/var/lib/sentinel/files
      # Persist ASP.NET Core Data Protection keys so restarts do not invalidate
      # authentication cookies or encrypted Sentinel settings.
      - DataProtection__KeyRingPath=/var/lib/sentinel/keys
    volumes:
      - sentinel-file-data:/var/lib/sentinel/files
      - sentinel-data-protection-keys:/var/lib/sentinel/keys
    restart: unless-stopped
    depends_on:
      - sentinel-db
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  sentinel-proxy:
    image: caddy:2.11.0-alpine
    container_name: sentinel-proxy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SENTINEL_HOSTNAME=${SENTINEL_HOSTNAME:?Set SENTINEL_HOSTNAME in .env}
      - ACME_EMAIL=${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sentinel-caddy-data:/data
      - sentinel-caddy-config:/config
    restart: unless-stopped
    depends_on:
      sentinel-web:
        condition: service_healthy
    networks:
      - sentinel-network

  sentinel-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sentinel-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      - MSSQL_PID=Developer
    volumes:
      - sentinel-db-data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  sentinel-db-data:
    driver: local
  sentinel-file-data:
    driver: local
  sentinel-data-protection-keys:
    driver: local
  sentinel-caddy-data:
    driver: local
  sentinel-caddy-config:
    driver: local

networks:
  sentinel-network:
    driver: bridge

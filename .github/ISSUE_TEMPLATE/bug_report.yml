name: Bug report
description: Report a reproducible Sentinel defect using non-sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include patient information, credentials, API keys, database
        contents, tokens or unredacted logs. Report security vulnerabilities
        privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual result and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sentinel version
      placeholder: 0.9.0-beta
  - type: textarea
    id: environment
    attributes:
      label: Environment and safe diagnostics
      description: Include operating system, browser and redacted error details if relevant.
